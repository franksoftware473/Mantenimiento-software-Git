<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviCampus - Inicio de sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 15px #0002;
        }
        h1 { color: #174b75; text-align: center; }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 9px 0;
            border-radius: 6px;
        }
        input { border: 1px solid #ccc; }
        button {
            background: #174b75;
            color: white;
            border: none;
            cursor: pointer;
        }
        #mensaje { text-align: center; color: #174b75; }
    </style>
</head>
<body>
    <div class="login">
        <h1>MoviCampus</h1>
        <h2>Iniciar sesión</h2>
        <form id="formulario">
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <input type="password" id="clave" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <p id="mensaje"></p>
    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("mensaje").textContent =
                "Formulario enviado correctamente. Prototipo académico.";
        });
    </script>
</body>
</html>
